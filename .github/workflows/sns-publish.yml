# 7時〜23時台（日本時間）に30分ごと、予定時刻を過ぎた承認済みの投稿を Threads に投稿する。
name: SNS 予約投稿
on:
  schedule:
    - cron: "3,33 22,23,0-14 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sns-main
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: sns/requirements.txt
      - run: pip install -r sns/requirements.txt
      - name: 投稿する
        env:
          THREADS_TOKEN_REIKA: ${{ secrets.THREADS_TOKEN_REIKA }}
          THREADS_TOKEN_MAKO: ${{ secrets.THREADS_TOKEN_MAKO }}
          THREADS_TOKEN_RIKO: ${{ secrets.THREADS_TOKEN_RIKO }}
          THREADS_TOKEN_MASHIRO: ${{ secrets.THREADS_TOKEN_MASHIRO }}
        run: python sns/publish.py
      - name: 投稿結果を記録する
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add sns/queue
          if ! git diff --cached --quiet; then
            git commit -m "SNS: 投稿結果を記録"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
